<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article Info Browser</title>
  <style>
    .doi_references {
      cursor: pointer;
      user-select: none;
    }
    .details_div {
      padding-left: 30px;
    }
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    #loading-overlay.show {
      display: flex;
    }
    .loading-container {
      text-align: center;
    }
    .progress-bar-container {
      width: 300px;
      height: 20px;
      background-color: #e0e0e0;
      border-radius: 10px;
      overflow: hidden;
      margin: 20px auto;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #4CAF50 0%, #45a049 50%, #4CAF50 100%);
      background-size: 200% 100%;
      width: 100%;
      animation: progress-animation 1.5s ease-in-out infinite;
    }
    @keyframes progress-animation {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }
    .loading-text {
      font-size: 18px;
      color: #333;
      margin-top: 10px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
</head>

<body>
  <div id="loading-overlay">
    <div class="loading-container">
      <div class="progress-bar-container">
        <div class="progress-bar"></div>
      </div>
      <div class="loading-text">Loading...</div>
    </div>
  </div>
  <h1>Article Info Browser</h1>
  <fieldset>
    <legend>Filter</legend>
    <ul>
      <li>
        <label>Type:</label> <select id="type-select" onchange="filterInputChange('type')"></select>
      </li>
      <li>
        <label>Container Title:</label> <select id="container-title-select" onchange="filterInputChange('container-title')"></select>
      </li>
      <li>
        <label>Year:</label> From <select id="year-from-select"></select> To <select id="year-to-select"></select> 
      </li>
    </ul>
    <button>Search</button>
    <button onclick="resetFilter()">Reset</button>

  </fieldset>
  <div id="output"></div>
  <div id="error"></div>
  <div style="margin: 20px 0;">
    <button id="renderAllButton">Render All</button>
    <div style="margin-top: 10px;">
      <button id="prevPageButton">前へ</button>
      <span id="pageInfo" style="margin: 0 10px;"></span>
      <button id="nextPageButton">次へ</button>
    </div>
  </div>
  <template id="author-template">
    <span class="author"></span></span>
  </template>
  <template id="doi-reference-template">
    <span class="doi-reference"></span></span>
  </template>

  <template id="doi-info-template">
    <article>
      <details>
        <summary class="title"></summary>
        <div class="details_div"">
          <ul>
            <li class="date"></li>
            <li><div class="authors"></div></li>
            <li class="container_title"></li>
            <li class="volume"></li>
            <li class="status"></li>
            <li><details>
              <summary>DOI References</summary>
              <div class="doi_references"></div>
            </details></li>
          </ul>
        </div>
      </details>
    </article>
  </template>
</body>

</html>
