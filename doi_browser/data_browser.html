<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article Info Browser</title>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <script type="module">
    import { DOIInfoCollection } from "./dist/browser.js";
    
    async function init() {
      try {
        const outputDiv = document.getElementById('output');
        const errorDiv = document.getElementById('error');
        
        // pakoが読み込まれているか確認
        if (typeof pako === 'undefined') {
          throw new Error('pako library failed to load');
        }



        const doiInfoCollection = await DOIInfoCollection.load("./doi_info_parts");
        console.log(doiInfoCollection.length());
        
        // 最初の10件を表示
        const count = Math.min(10, doiInfoCollection.length());
        let html = '<h2>最初の10件のDOI情報:</h2><ul>';
        for (let i = 0; i < count; i++) {
          const doiInfo = doiInfoCollection.getDOIInfo(i);
          html += `<li><strong>${i + 1}.</strong>`;
          html += `<div style="margin-left: 20px; margin-top: 5px;">`;
          html += `<div><strong>DOI:</strong> ${doiInfo.doi || '(なし)'}</div>`;
          if (doiInfo.status && doiInfo.status !== 'unknown') {
            html += `<div><strong>Status:</strong> ${doiInfo.status}</div>`;
          }
          if (doiInfo.title) html += `<div><strong>Title:</strong> ${doiInfo.title}</div>`;
          if (doiInfo.container_title) html += `<div><strong>Container Title:</strong> ${doiInfo.container_title}</div>`;
          if (doiInfo.year >= 0) html += `<div><strong>Year:</strong> ${doiInfo.year}</div>`;
          if (doiInfo.month >= 0) html += `<div><strong>Month:</strong> ${doiInfo.month}</div>`;
          if (doiInfo.authors && doiInfo.authors.length > 0) {
            html += `<div><strong>Authors:</strong> ${doiInfo.authors.join(', ')}</div>`;
          }
          if (doiInfo.volume) html += `<div><strong>Volume:</strong> ${doiInfo.volume}</div>`;
          if (doiInfo.doiReferences && doiInfo.doiReferences.length > 0) {
            html += `<div><strong>DOI References:</strong> ${doiInfo.doiReferences.join(', ')}</div>`;
          }
          if (doiInfo.tags && doiInfo.tags.length > 0) {
            html += `<div><strong>Tags:</strong> ${doiInfo.tags.join(', ')}</div>`;
          }
          html += '</div></li>';
        }
        html += '</ul>';
        html += `<p>合計: ${doiInfoCollection.length()}件</p>`;
        outputDiv.innerHTML = html;
        
      } catch (error) {
        const errorDiv = document.getElementById('error');
        errorDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
        console.error('Error:', error);
      }
    }
    
    init();
  </script>
</head>
<body>
  <h1>Article Info Browser</h1>
  <div id="output"></div>
  <div id="error"></div>
</body>
</html>
